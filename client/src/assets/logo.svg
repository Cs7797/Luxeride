<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700">
  <defs>
    <!-- Premium realistic gold gradient -->
    <linearGradient id="gold_real" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9D4"></stop>
      <stop offset="20%" stop-color="#F6E08F"></stop>
      <stop offset="40%" stop-color="#E3C462"></stop>
      <stop offset="60%" stop-color="#D4AF37"></stop>
      <stop offset="80%" stop-color="#B78C16"></stop>
      <stop offset="100%" stop-color="#8A6103"></stop>
    </linearGradient>

    <!-- Soft under-glow -->
    <radialGradient id="shadow" cx="0.5" cy="0.8" r="0.9">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"></stop>
      <stop offset="1" stop-color="transparent"></stop>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="900" cy="480" rx="750" ry="130" fill="url(#shadow)" opacity="0.45"></ellipse>

  <!-- SUPER-REALISTIC LUXURY CAR BODY -->
  <path fill="url(#gold_real)" d="
    M260 380
    C270 330, 300 295, 360 270
    C430 240, 540 225, 690 220
    L1020 220
    C1150 225, 1280 245, 1360 290
    C1405 315, 1430 350, 1445 380
    L1480 410

    L1470 420
    C1420 425, 1325 430, 1220 430
    C1130 430, 1090 380, 1005 375
    C925 370, 885 430, 800 435
    C725 440, 690 380, 610 380
    C545 380, 510 420, 460 445
    C405 470, 315 455, 260 380
    Z"></path>

  <!-- WINDOWS / GLASS -->
  <path fill="#000" opacity="0.55" d="
    M480 270
    C610 240, 860 240, 1070 270
    L1180 305
    L1160 340
    C1020 330, 850 330, 560 340
    Z"></path>

  <!-- DOOR LINES -->
  <path d="M700 270 L700 380" stroke="#000" stroke-width="6" opacity="0.4"></path>
  <path d="M950 270 L950 380" stroke="#000" stroke-width="6" opacity="0.4"></path>

  <!-- FRONT DETAIL (grille & bumper line) -->
  <path d="M1360 325 L1440 350" stroke="#000" stroke-width="8" opacity="0.45" stroke-linecap="round"></path>

  <!-- REAR DETAIL -->
  <path d="M330 360 L270 345" stroke="#000" stroke-width="8" opacity="0.45" stroke-linecap="round"></path>


  <!-- Wheels: realistic proportion -->
  <circle cx="600" cy="420" r="95" fill="url(#gold_real)"></circle>
  <circle cx="600" cy="420" r="58" fill="#111" opacity="0.75"></circle>

  <circle cx="1200" cy="420" r="95" fill="url(#gold_real)"></circle>
  <circle cx="1200" cy="420" r="58" fill="#111" opacity="0.75"></circle>

  <!-- Underline -->
  <rect x="350" y="520" width="1100" height="12" rx="6" fill="url(#gold_real)"></rect>

  <!-- LUXE RIDE text -->
  <text x="900" y="620" text-anchor="middle" font-family="Cinzel, Trajan Pro, Georgia, serif" font-size="150" font-weight="700" fill="url(#gold_real)" letter-spacing="14">
    LUXE RIDE
  </text>
</svg>
